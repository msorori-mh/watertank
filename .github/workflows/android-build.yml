name: Android Build

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "android/**"
      - "src/**"
      - "public/**"
      - "scripts/**"
      - "package.json"
      - "bun.lock"
      - "capacitor.config.ts"
      - ".github/workflows/android-build.yml"

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    name: Verify and build Android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VITE_SUPABASE_URL: https://actynnctmmyysocqxwdi.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFjdHlubmN0bW15eXNvY3F4d2RpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg2OTcxMzYsImV4cCI6MjA5NDI3MzEzNn0.s4x0s4pmbu5tZHtKFBYH8X9_0RccTm1trEp6nL8eJmU
      VITE_PHONE_PASSWORD_PILOT: "true"

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify security closure
        run: node scripts/verify-security-closure.mjs

      - name: Verify cash-only MVP
        run: node scripts/verify-mvp-cash-only.mjs

      - name: Verify Google Play readiness
        run: node scripts/verify-google-play-readiness.mjs

      - name: Verify pilot phone/password auth
        run: bun run auth:verify

      - name: Verify Android readiness
        run: node scripts/verify-android-play-readiness.mjs

      - name: Build web assets and sync Android
        run: bun run android:sync

      - name: Generate first Google Play upload key
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/first-signed-google-play-release'
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          STORE_PASSWORD="$(openssl rand -hex 24)"
          KEY_ALIAS="wayetmaa-upload"
          echo "::add-mask::$STORE_PASSWORD"
          keytool -genkeypair -v \
            -keystore upload-keystore.jks \
            -storepass "$STORE_PASSWORD" \
            -keypass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            -keyalg RSA \
            -keysize 4096 \
            -validity 10000 \
            -dname "CN=Wayet Maa, OU=Mobile, O=SysTrac, L=Marib, C=YE"
          {
            echo "WAYETMAA_KEYSTORE_PATH=upload-keystore.jks"
            echo "WAYETMAA_KEYSTORE_PASSWORD=$STORE_PASSWORD"
            echo "WAYETMAA_KEY_ALIAS=$KEY_ALIAS"
            echo "WAYETMAA_KEY_PASSWORD=$STORE_PASSWORD"
          } >> "$GITHUB_ENV"
          {
            echo "App: وايت ماء"
            echo "Application ID: app.wayetmaa.mobile"
            echo "Key alias: $KEY_ALIAS"
            echo "Keystore password: $STORE_PASSWORD"
            echo "Key password: $STORE_PASSWORD"
            echo "Keep this file and upload-keystore.jks secure. They are required for every update."
          } > upload-key-credentials.txt
          keytool -list -v -keystore upload-keystore.jks -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" > upload-key-certificate.txt

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Build release AAB
        working-directory: android
        run: ./gradlew --no-daemon bundleRelease

      - name: Verify signed Google Play AAB
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/first-signed-google-play-release'
        working-directory: android
        run: jarsigner -verify -verbose -certs app/build/outputs/bundle/release/app-release.aab

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: wayetmaa-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload signed Google Play release package
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/first-signed-google-play-release'
        uses: actions/upload-artifact@v4
        with:
          name: wayetmaa-google-play-signed-release
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/upload-keystore.jks
            android/upload-key-credentials.txt
            android/upload-key-certificate.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload unsigned release AAB
        if: github.event_name != 'pull_request' || github.head_ref != 'codex/first-signed-google-play-release'
        uses: actions/upload-artifact@v4
        with:
          name: wayetmaa-unsigned-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
