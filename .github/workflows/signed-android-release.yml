name: Signed Android Release

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/signed-android-release.yml"

permissions:
  actions: read
  contents: read

jobs:
  signed-release:
    name: Build and verify signed APK and AAB
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      VITE_SUPABASE_URL: https://actynnctmmyysocqxwdi.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFjdHlubmN0bW15eXNvY3F4d2RpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg2OTcxMzYsImV4cCI6MjA5NDI3MzEzNn0.s4x0s4pmbu5tZHtKFBYH8X9_0RccTm1trEp6nL8eJmU

    steps:
      - name: Checkout merged application source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Install Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Restore original upload key
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/actions/artifacts/9485754714/zip > /tmp/upload-key.zip
          mkdir -p /tmp/wayetmaa-key
          unzip -q /tmp/upload-key.zip -d /tmp/wayetmaa-key
          STORE_PASSWORD="$(awk -F': ' '/^Keystore password:/{print $2}' /tmp/wayetmaa-key/upload-key-credentials.txt)"
          KEY_PASSWORD="$(awk -F': ' '/^Key password:/{print $2}' /tmp/wayetmaa-key/upload-key-credentials.txt)"
          KEY_ALIAS="$(awk -F': ' '/^Key alias:/{print $2}' /tmp/wayetmaa-key/upload-key-credentials.txt)"
          test -n "$STORE_PASSWORD" && test -n "$KEY_PASSWORD" && test -n "$KEY_ALIAS"
          echo "::add-mask::$STORE_PASSWORD"
          echo "::add-mask::$KEY_PASSWORD"
          {
            echo "WAYETMAA_KEYSTORE_PATH=/tmp/wayetmaa-key/upload-keystore.jks"
            echo "WAYETMAA_KEYSTORE_PASSWORD=$STORE_PASSWORD"
            echo "WAYETMAA_KEY_ALIAS=$KEY_ALIAS"
            echo "WAYETMAA_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify release contracts
        run: |
          node scripts/verify-security-closure.mjs
          node scripts/verify-google-play-readiness.mjs
          bun run auth:verify
          bun run android:verify

      - name: Build web assets and sync Android
        run: bun run android:sync

      - name: Build signed release APK and AAB
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease bundleRelease

      - name: Verify APK and AAB signatures
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs android/app/build/outputs/apk/release/app-release.apk
          jarsigner -verify -strict android/app/build/outputs/bundle/release/app-release.aab

      - name: Stage named release files
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/release/app-release.apk release/wayetmaa-v1.0.0-google-auth-signed.apk
          cp android/app/build/outputs/bundle/release/app-release.aab release/wayetmaa-v1.0.0-google-auth-signed.aab
          sha256sum release/* > release/SHA256SUMS.txt

      - name: Upload signed release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wayetmaa-google-auth-signed-release
          path: release/
          if-no-files-found: error
          retention-days: 30
